<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>S2G Proxy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon48.png" alt="S2G Logo" class="logo">
      <h1>S2G Proxy</h1>
    </div>
    
    <div class="status-container">
      <div class="status-indicator" id="statusDot"></div>
      <span class="status-text" id="statusText">Checking Status...</span>
    </div>

    <div class="control-group">
      <label class="switch">
        <input type="checkbox" id="proxyToggle">
        <span class="slider round"></span>
      </label>
      <span class="toggle-label">Enable Zero-Trust Session Firewall</span>
    </div>

    <div class="actions">
      <button id="setupBtn" class="secondary-btn">View Setup Guide</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
